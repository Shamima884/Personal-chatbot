<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Shamima Jahan — Chatbots</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">🩺</div>
        <div class="brand-text">
          <h1>Dr. Shamima Jahan</h1>
          <p class="tagline">Associate Professor · Physiology · AI Trainer</p>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Chatbot selection">
        <button class="tab active" data-bot="custom">Custom</button>
        <button class="tab" data-bot="profile">Profile</button>
        <button class="tab" data-bot="story">Story</button>
        <button class="tab" data-bot="main">Groq AI</button>
        <button
          type="button"
          class="tab drawer-toggle"
          id="drawer-toggle"
          data-drawer="1"
          title="Show chat history"
          aria-label="Show chat history"
        >☰ History</button>
      </nav>
    </header>

    <main class="chat-wrap">
      <div class="chat" id="chat" aria-live="polite"></div>

      <div class="suggestions" id="suggestions"></div>

      <form class="input-bar" id="input-form" autocomplete="off">
        <input
          type="text"
          id="message"
          placeholder="Type your question…"
          autocomplete="off"
          aria-label="Message"
        />
        <button type="submit" id="send-btn">Send</button>
      </form>
    </main>
  </div>

  <!-- History drawer (slide-out panel) -->
  <aside class="drawer" id="drawer" aria-label="Chat history">
    <div class="drawer-header">
      <h2>☰ History</h2>
      <button type="button" class="drawer-close" id="drawer-close"
              aria-label="Close history" title="Close">✕</button>
    </div>
    <button type="button" class="new-chat-btn" id="new-chat-btn">
      ＋ New chat
    </button>
    <div class="session-list" id="session-list"></div>
  </aside>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

  <script src="script.js"></script>
</body>
</html>
